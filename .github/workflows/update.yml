name: Update AVYRN VPN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: avyrn-subscription-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GeoIP label dependency
        run: pip install pycountry

      - name: Build subscription
        run: python3 scripts/build.py

      - name: Validate JSON and four isolated modes
        run: |
          python3 -m json.tool subscription.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          profiles = json.loads(Path("subscription.json").read_text(encoding="utf-8"))
          names = [p.get("remarks", "") for p in profiles]
          assert names.count("AVYRN | AUTO") == 1, names
          assert names.count("AVYRN БС | AUTO") == 1, names
          regular_manual = [p for p in profiles if "AVYRN | " in p.get("remarks", "") and p.get("remarks") != "AVYRN | AUTO"]
          whitelist_manual = [p for p in profiles if "AVYRN БС | " in p.get("remarks", "") and p.get("remarks") != "AVYRN БС | AUTO"]
          assert regular_manual, "No regular manual profiles"
          assert whitelist_manual, "No whitelist manual profiles"
          regular_auto = next(p for p in profiles if p.get("remarks") == "AVYRN | AUTO")
          whitelist_auto = next(p for p in profiles if p.get("remarks") == "AVYRN БС | AUTO")
          regular_nodes = [o.get("tag", "") for o in regular_auto.get("outbounds", []) if o.get("protocol") in ("vless", "trojan")]
          whitelist_nodes = [o.get("tag", "") for o in whitelist_auto.get("outbounds", []) if o.get("protocol") in ("vless", "trojan")]
          assert regular_nodes and all("AVYRN БС | " not in t for t in regular_nodes), regular_nodes
          assert whitelist_nodes and all("AVYRN | " not in t for t in whitelist_nodes), whitelist_nodes
          assert len(profiles) == len(regular_manual) + len(whitelist_manual) + 2
          print(f"Validated {len(regular_manual)} regular + {len(whitelist_manual)} whitelist + 2 AUTO profiles")
          PY

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update AVYRN subscription"
            git push
          fi
