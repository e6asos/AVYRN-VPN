name: Update AVYRN VPN

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: avyrn-subscription-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GeoIP label dependency
        run: pip install pycountry

      - name: Build subscription
        run: python3 scripts/build.py

      - name: Validate JSON
        run: python3 -m json.tool subscription.json > /dev/null

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update AVYRN subscription"
            git push
          fi
