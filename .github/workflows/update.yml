name: Update AVYRN VPN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: avyrn-subscription-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GeoIP label dependency
        run: pip install pycountry

      - name: Build subscription
        run: python3 scripts/build.py

      - name: Validate JSON
        run: python3 -m json.tool subscription.json > /dev/null

      - name: Validate four isolated modes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          profiles = json.loads(Path("subscription.json").read_text(encoding="utf-8"))
          names = [p.get("remarks", "") for p in profiles]
          assert names.count("AVYRN | AUTO") == 1, names
          assert names.count("AVYRN БС | AUTO") == 1, names
          assert sum(n.startswith("🇷") or n.startswith("🏳️ AVYRN |") for n in names) >= 1
          assert len(profiles) >= 12, len(profiles)
          for p in profiles:
              if p.get("remarks") == "AVYRN | AUTO":
                  tags = [o.get("tag", "") for o in p.get("outbounds", [])]
                  assert tags and all("AVYRN БС" not in t for t in tags), tags
              if p.get("remarks") == "AVYRN БС | AUTO":
                  tags = [o.get("tag", "") for o in p.get("outbounds", [])]
                  assert tags and all("AVYRN | " not in t for t in tags), tags
          print(f"Validated {len(profiles)} Happ profiles")
          PY

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update AVYRN subscription"
            git push
          fi
